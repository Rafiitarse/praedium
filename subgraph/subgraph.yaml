specVersion: 1.0.0
description: Indexes the Praedium RWA contracts — token transfers, investor compliance records, and asset provenance.
schema:
  file: ./schema.graphql
dataSources:
  # ── RWAToken: ERC-20 transfers + asset mint/burn ──
  - kind: ethereum
    name: RWAToken
    network: sepolia
    source:
      address: "0x53FfF7C20B6DBD66234D769d41EC4C1fA698e109"
      abi: RWAToken
      startBlock: 11899800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
        - Investor
        - GlobalStat
      abis:
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: AssetMinted(indexed uint256,indexed address,uint256)
          handler: handleAssetMinted
        - event: AssetBurned(indexed uint256,indexed address,uint256)
          handler: handleAssetBurned
      file: ./src/mappings.ts

  # ── ComplianceRegistry: investor whitelist lifecycle ──
  - kind: ethereum
    name: ComplianceRegistry
    network: sepolia
    source:
      address: "0xC59Ae783679AD55b0d85b2a3F51aC3a652212dF5"
      abi: ComplianceRegistry
      startBlock: 11899800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Investor
        - GlobalStat
      abis:
        - name: ComplianceRegistry
          file: ./abis/ComplianceRegistry.json
      eventHandlers:
        - event: InvestorVerified(indexed address,uint64,uint16)
          handler: handleInvestorVerified
        - event: InvestorRevoked(indexed address)
          handler: handleInvestorRevoked
        - event: InvestorFrozen(indexed address,bool)
          handler: handleInvestorFrozen
      file: ./src/mappings.ts

  # ── AssetRegistry: asset provenance and lifecycle ──
  - kind: ethereum
    name: AssetRegistry
    network: sepolia
    source:
      address: "0xDbbB1D614C642707e92019828b884520357c772c"
      abi: AssetRegistry
      startBlock: 11899800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Asset
      abis:
        - name: AssetRegistry
          file: ./abis/AssetRegistry.json
      eventHandlers:
        - event: AssetRegistered(indexed uint256,bytes32,indexed address)
          handler: handleAssetRegistered
        - event: AssetUpdated(indexed uint256,bytes32,string,uint256,uint64)
          handler: handleAssetUpdated
        - event: AssetStatusChanged(indexed uint256,uint8)
          handler: handleAssetStatusChanged
      file: ./src/mappings.ts
